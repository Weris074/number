<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Игра Угадай Число</title>
<style>
body {
font-family: Arial, sans-serif;
text-align: center;
margin-top: 50px;
animation: bg-pulse 30s infinite alternate;
min-height: 100vh;
position: relative;
padding-bottom: 140px;
box-sizing: border-box;
}
@keyframes bg-pulse {
from {background-position: 0%; transform: scale(1);}
to {background-position: 100%; transform: scale(1.02); animation-timing-function: ease-in-out;}
}
h1 {
color: white;
font-size: 3rem;
letter-spacing: 2px;
text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}
input[type=number], button {
padding: 20px;
font-size: 20px;
border-radius: 15px;
outline: none;
box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
transition: all 0.3s ease-in-out;
cursor: pointer;
margin: 5px;
}
input[type=number] {
width: 60%;
box-sizing: border-box;
display: inline-block;
}
.input-group {
display: flex;
justify-content: center;
align-items: center;
margin-bottom: 10px;
}
.input-group button {
width: 30%;
flex-shrink: 0;
}
.action-group {
margin-top: 10px;
margin-bottom: 20px;
}
.action-group button {
width: 45%;
max-width: 200px;
}
input[type=number]:hover,
button:hover {
background-color: #fffaf0;
transform: scale(1.05);
}
input[type=number]:focus,
button:focus {
background-color: #ffe4b5;
}
p#result {
font-weight: bold;
color: green;
font-size: 1.5rem;
animation: pulse 1s infinite alternate;
}
@keyframes pulse {
from {transform: scale(1)}
to {transform: scale(1.05)}
}
p#message {
font-style: italic;
color: white;
font-size: 1.2rem;
text-shadow: 2px 2px 2px rgba(0,0,0,2);
}
ul#clues-list li {
list-style-type: circle;
line-height: 1.5em;
color: #333;
text-shadow: none;
text-align: left;
max-width: 400px;
margin: 0 auto 5px;
}
.green-text { color: limegreen !important; }
.yellow-text { color: gold !important; }
.blue-text { color: dodgerblue !important; }
.red-text { color: tomato !important; }

/* Очки */
#points-display {
position: fixed;
top: 10px;
right: 10px;
background: linear-gradient(135deg, #ffd700, #ff8c00);
padding: 10px 20px;
border-radius: 20px;
font-size: 1.5rem;
font-weight: bold;
color: #333;
box-shadow: 0 4px 15px rgba(0,0,0,0.3);
z-index: 1000;
}

#achievements-container,
#player-stats-container,
#theme-shop-container {
margin-top: 40px;
padding: 20px;
background-color: rgba(255, 255, 255, 0.8);
border-radius: 10px;
box-shadow: 0 0 10px rgba(0,0,0,0.1);
max-width: 500px;
margin-left: auto;
margin-right: auto;
display: none;
margin-bottom: 20px;
}
#achievements-container h2,
#player-stats-container h2,
#theme-shop-container h2 {
color: #333;
margin-bottom: 15px;
}

/* Достижения */
.achievement-item {
display: flex;
align-items: center;
margin-bottom: 10px;
font-size: 1rem;
color: #555;
text-align: left;
padding: 8px;
border-radius: 5px;
}
.achievement-item.unlocked {
color: #28a745;
font-weight: bold;
background: rgba(40, 167, 69, 0.1);
}
.achievement-item.locked {
color: #888;
opacity: 0.7;
}
.achievement-item::before {
content: '🔒';
margin-right: 10px;
font-size: 1.3rem;
flex-shrink: 0;
}
.achievement-item.unlocked::before {
content: '🏆';
}

.stat-item {
margin-bottom: 8px;
font-size: 1.1rem;
color: #555;
text-align: left;
}

/* Магазин тем */
.theme-item {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 10px;
padding: 10px;
background: rgba(255,255,255,0.7);
border-radius: 8px;
}
.theme-item.unlocked {
background: rgba(40, 167, 69, 0.2);
}
.theme-item button {
padding: 5px 15px;
font-size: 0.9rem;
min-width: 100px;
}
.theme-item button:disabled {
background-color: #ccc;
cursor: not-allowed;
}
.theme-preview {
width: 30px;
height: 30px;
border-radius: 5px;
display: inline-block;
margin-right: 10px;
border: 2px solid #333;
}

#toggle-buttons-wrapper {
position: absolute;
bottom: 100px;
left: 50%;
transform: translateX(-50%);
display: flex;
flex-wrap: wrap;
justify-content: center;
gap: 10px;
width: 100%;
z-index: 10;
}
#toggle-buttons-wrapper button {
padding: 10px 15px;
font-size: 1rem;
border-radius: 8px;
box-shadow: 0 2px 5px rgba(0,0,0,0.2);
background-color: #007bff;
color: white;
border: none;
cursor: pointer;
transition: background-color 0.2s;
min-width: 140px;
}
#toggle-buttons-wrapper button:hover {
background-color: #0056b3;
}
#footer-buttons {
position: absolute;
bottom: 20px;
left: 50%;
transform: translateX(-50%);
display: flex;
flex-wrap: wrap;
gap: 10px;
justify-content: center;
max-width: 90%;
z-index: 1;
}

padding: 10px 15px;
font-size: 1rem;
border-radius: 8px;
box-shadow: 0 2px 5px rgba(0,0,0,0.2);
background-color: #007bff;
color: white;
border: none;
cursor: pointer;
transition: background-color 0.2s;

background-color: #0056b3;
}

margin-top: 20px;
margin-bottom: 10px;
font-weight: bold;
color: #333;

margin-top: 20px;
padding: 15px;
background-color: rgba(255, 255, 255, 0.7);
border-radius: 8px;
box-shadow: 0 0 8px rgba(0,0,0,0.1);

padding: 8px 12px;
font-size: 0.9rem;
margin: 3px;
border-radius: 5px;

#background-settings button.locked {
background-color: #ccc;
cursor: not-allowed;
opacity: 0.6;
}
#range-settings {
display: none;
margin-bottom: 20px;
}

function hasRepeatingDigits(num) {
const str = String(num);
if (str.length < 2) return false;
const digits = str.split('');
return digits.every(d => d === digits[0]);
}

function generateRandomNumber() {
return Math.floor(Math.random() * (maxNumber - minNumber + 1)) + minNumber;
}

function isPrime(num) {
if (num <= 1) return false;
for (let i = 2, s = Math.sqrt(num); i <= s; i++) {
if (num % i === 0) return false;
}
return true;
}

function isPerfectSquare(num) {
const sqrt = Math.sqrt(num);
return sqrt === Math.floor(sqrt);
}

function isFibonacci(num) {
if (num < 0) return false;
if (num === 0 || num === 1) return true;
let a = 0, b = 1;
while (b < num) {
let temp = b;
b = a + b;
a = temp;
}
return b === num;
}

function getFactorCount(num) {
let count = 0;
for (let i = 1; i <= num; i++) {
if (num % i === 0) count++;
}
return count;
}

function closestSquareRoot(num) {
return Math.round(Math.sqrt(num));
}

function sumDigits(num) {
return String(num).split('').reduce((s, d) => s + parseInt(d), 0);
}

function isPalindrome(num) {
const str = String(num);
return str === str.split('').reverse().join('');
}

function closestRoundNumber(num) {
const round = Math.round(num / 10) * 10;
return round < 1 ? 1 : round;
}

function isInMultiplicationTable(num) {
for (let i = 2; i <= 10; i++) {
for (let j = 2; j <= 10; j++) {
if (i * j === num) return true;
}
}
return false;
}

function initializeClueOptions() {
const t = texts[currentLang];
availableClueOptions = [];

const lower = Math.max(minNumber, targetNumber - Math.floor(Math.random() * (maxNumber - minNumber) / 10) - 1);
if (lower < targetNumber) {
availableClueOptions.push({ id: 'clue_more_than', getClue: () => t.clueMoreThan(lower) });
}

const upper = Math.min(maxNumber, targetNumber + Math.floor(Math.random() * (maxNumber - minNumber) / 10) + 1);
if (upper > targetNumber) {
availableClueOptions.push({ id: 'clue_less_than', getClue: () => t.clueLessThan(upper) });
}

availableClueOptions.push({ id: 'clue_last_digit', getClue: () => t.clueLastDigit(targetNumber % 10) });

const mid = Math.floor((minNumber + maxNumber) / 2);
if (targetNumber !== mid) {
availableClueOptions.push({ id: 'clue_closer_to', getClue: () => {
const x = targetNumber < mid ? minNumber : maxNumber;
const y = targetNumber < mid ? maxNumber : minNumber;
return t.clueCloserTo(x, y);
}});
}

if (isInMultiplicationTable(targetNumber)) {
availableClueOptions.push({ id: 'clue_mult_table', getClue: () => t.clueInMultiplicationTable });
}

const digitSum = sumDigits(targetNumber);
if (digitSum > 5) {
availableClueOptions.push({ id: 'clue_sum_more', getClue: () => t.clueSumMoreThan(5) });
} else {
availableClueOptions.push({ id: 'clue_sum_less', getClue: () => t.clueSumLessThan(10) });
}

const notDivisors = [];
for (let i = 2; i <= 10; i++) {
if (targetNumber % i !== 0) notDivisors.push(i);
}
if (notDivisors.length > 0) {
const rand = notDivisors[Math.floor(Math.random() * notDivisors.length)];
availableClueOptions.push({ id: 'clue_not_divisible', getClue: () => t.clueNotDivisibleBy(rand) });
}

availableClueOptions.push({ id: 'clue_closest_square', getClue: () => t.clueClosestSquare(closestSquareRoot(targetNumber)) });

if (targetNumber % 2 === 0) {
availableClueOptions.push({ id: 'clue_even', getClue: () => t.clueEven });
} else {
availableClueOptions.push({ id: 'clue_odd', getClue: () => t.clueOdd });
}

if (isPrime(targetNumber)) {
availableClueOptions.push({ id: 'clue_prime', getClue: () => t.cluePrime });
} else if (targetNumber > 1) {
availableClueOptions.push({ id: 'clue_not_prime', getClue: () => t.clueNotPrime });
}

if (targetNumber > 1) {
const divisors = [];
for (let i = 2; i <= Math.min(10, targetNumber); i++) {
if (targetNumber % i === 0) divisors.push(i);
}
if (divisors.length > 0) {
const rand = divisors[Math.floor(Math.random() * divisors.length)];
availableClueOptions.push({ id: 'clue_divisible_by', getClue: () => t.clueDivisibleBy(rand) });
}
}

availableClueOptions.push({ id: 'clue_sum_of_digits', getClue: () => t.clueSumOfDigits(digitSum) });

const digits = String(targetNumber).split('').map(Number);
if (digits.length > 0) {
const rand = digits[Math.floor(Math.random() * digits.length)];
availableClueOptions.push({ id: 'clue_contains_digit', getClue: () => t.clueContainsDigit(rand) });
}

availableClueOptions.push({ id: 'clue_closest_round', getClue: () => t.clueClosestRound(closestRoundNumber(targetNumber)) });

if (isFibonacci(targetNumber)) {
availableClueOptions.push({ id: 'clue_fibonacci', getClue: () => t.clueFibonacci });
} else {
availableClueOptions.push({ id: 'clue_not_fibonacci', getClue: () => t.clueNotFibonacci });
}

if (targetNumber > 0) {
availableClueOptions.push({ id: 'clue_factor_count', getClue: () => t.clueFactorCount(getFactorCount(targetNumber)) });
}

if (isPerfectSquare(targetNumber)) {
availableClueOptions.push({ id: 'clue_is_perfect_square', getClue: () => t.clueIsPerfectSquare });
} else {
availableClueOptions.push({ id: 'clue_is_not_perfect_square', getClue: () => t.clueIsNotPerfectSquare });
}

if (targetNumber > 9 && isPalindrome(targetNumber)) {
availableClueOptions.push({ id: 'clue_palindrome', getClue: () => t.cluePalindrome });
} else if (targetNumber > 9) {
availableClueOptions.push({ id: 'clue_not_palindrome', getClue: () => t.clueNotPalindrome });
}

availableClueOptions.push({ id: 'clue_difference_from_middle', getClue: () => t.clueDifferenceFromMiddle(Math.abs(targetNumber - mid)) });
}

const list = document.getElementById('clues-list');

function setupGame() {
targetNumber = generateRandomNumber();
attempts = 0;
history = [];
clues = [];
usedClueTypesInCurrentGame = new Set();
isWon = false;
initializeClueOptions();
document.getElementById('message').textContent = texts[currentLang].messageWithRange(minNumber, maxNumber);
document.getElementById('get-clue-button').disabled = false;
document.getElementById('clues-list').innerHTML = '';
console.log("Загаданное число:", targetNumber);
}

function checkGuess() {
const input = document.getElementById('guessInput');
const guess = parseInt(input.value.trim(), 10);
const result = document.getElementById('result');
const t = texts[currentLang];

if (!guess || isNaN(guess) || guess < minNumber || guess > maxNumber) {
alert(t.resultEnterNumber(minNumber, maxNumber));
input.value = '';
return;
}

if (history.includes(guess)) {
result.className = 'red-text';
result.textContent = t.resultAlreadyGuessed;
input.value = '';
return;
}

attempts++;
playerPoints += 10;
updatePointsDisplay();

history.push(guess);

if (guess === targetNumber) {
result.className = 'green-text';
result.textContent = t.resultCorrect(targetNumber, attempts);
document.getElementById('message').style.display = 'none';
input.disabled = true;
document.getElementById('check-button').disabled = true;
document.getElementById('get-clue-button').disabled = true;
isWon = true;
playerStats.totalGames++;
playerStats.totalWins++;
playerStats.totalAttempts += attempts;
if (maxNumber > playerStats.maxRangeWin) playerStats.maxRangeWin = maxNumber;
playerStats.avgAttemptsPerWin = playerStats.totalWins > 0 ? (playerStats.totalAttempts / playerStats.totalWins).toFixed(2) : 0;
savePlayerStats();
checkAchievements();
renderPlayerStats();
} else if (guess > targetNumber) {
result.className = 'red-text';
result.textContent = t.resultTooHigh;
} else {
result.className = 'blue-text';
result.textContent = t.resultTooLow;
}
input.value = '';
}

function resetGame() {
if (!isWon) {
playerStats.totalGames++;
playerStats.totalLosses++;
savePlayerStats();
}
setupGame();
const result = document.getElementById('result');
const input = document.getElementById('guessInput');
result.textContent = '';
result.className = '';
document.getElementById('message').style.display = '';
document.getElementById('message').textContent = texts[currentLang].messageWithRange(minNumber, maxNumber);
input.value = '';
input.disabled = false;
document.getElementById('check-button').disabled = false;
document.getElementById('get-clue-button').disabled = false;
document.getElementById('clues-list').innerHTML = '';
renderAchievements();
renderPlayerStats();
updateTexts();
}

// Инициализация
loadAchievements();
updateTexts();
setupGame();
setBackground(currentBackground);
renderPlayerStats();
updatePointsDisplay();
updateBackgroundButtons();
</script>
